# ============================================================
# Bloque nginx para el proxy WebSocket de scrcpy-ws
# ------------------------------------------------------------
# DÓNDE INSTALARLO:
#   Opción A – archivo separado (recomendado):
#     Copiar este archivo a /etc/nginx/snippets/scrcpy-ws.conf
#     Luego dentro del server{} block de tu sitio, agregar:
#       include snippets/scrcpy-ws.conf;
#
#   Opción B – pegar directamente:
#     Copiar el bloque location{} dentro del server{} de tu
#     archivo de sitio, normalmente en:
#       /etc/nginx/sites-available/vpn.powerboxchile.cl
#       o /etc/nginx/conf.d/default.conf
#
# Después de cualquier cambio: nginx -t && systemctl reload nginx
# ============================================================

location /scrcpy-ws/ {
    # Sin barra al final: nginx pasa el URI completo incluyendo query string
    # (con barra: reescribe el path y puede perder ?device=xxx en upgrades WS)
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
